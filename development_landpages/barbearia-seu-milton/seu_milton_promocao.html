<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Milton Barbearia - Promoção</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
  }
  .post {
    position: relative;
    width: 1080px; height: 1080px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #1a1a1a 100%);
  }
  /* Barbeiro background image overlay */
  .bg-pattern {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
  }
  /* Diagonal stripe accent */
  .diagonal {
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: linear-gradient(135deg, transparent 49.9%, rgba(212, 175, 55, 0.06) 50%, transparent 50.1%);
    transform: rotate(15deg);
  }
  /* Gold border frame */
  .frame {
    position: absolute;
    top: 30px; left: 30px;
    right: 30px; bottom: 30px;
    border: 1px solid rgba(212, 175, 55, 0.2);
    pointer-events: none;
  }
  .frame-inner {
    position: absolute;
    top: 38px; left: 38px;
    right: 38px; bottom: 38px;
    border: 1px solid rgba(212, 175, 55, 0.1);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 80px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .logo {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #a67c00);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #0a0a0a;
    font-weight: 900;
    box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
  }
  .brand-name {
    color: #d4af37;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .brand-sub {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }
  .tag {
    display: inline-block;
    padding: 10px 24px;
    border-radius: 4px;
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #d4af37;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 30px;
    align-self: flex-start;
  }
  h1 {
    font-family: 'Times New Roman', serif;
    font-size: 90px;
    line-height: 0.95;
    color: #ffffff;
    font-weight: 700;
    max-width: 700px;
  }
  h1 span { color: #d4af37; }
  .pricing {
    display: flex;
    gap: 40px;
    margin-top: 50px;
  }
  .price-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 12px;
    padding: 30px 40px;
    min-width: 240px;
    text-align: center;
  }
  .price-card .label {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .price-card .service {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin-top: 8px;
  }
  .price-card .price {
    color: #d4af37;
    font-size: 48px;
    font-weight: 900;
    margin-top: 10px;
  }
  .price-card .price small {
    font-size: 22px;
    font-weight: 700;
  }
  .price-card.featured {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
    border-color: #d4af37;
  }
  .footer-cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 280px;
    min-height: 70px;
    padding: 0 36px;
    border-radius: 6px;
    background: linear-gradient(135deg, #d4af37, #a67c00);
    color: #0a0a0a;
    text-decoration: none;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 20px 50px rgba(212, 175, 55, 0.3);
  }
  .cta:hover { transform: scale(1.02); }
  .footer-note {
    color: rgba(255,255,255,0.35);
    font-size: 14px;
    max-width: 350px;
    line-height: 1.4;
  }
  /* Decorative elements */
  .line-deco {
    width: 60px;
    height: 2px;
    background: #d4af37;
    margin-top: 20px;
  }
  @media (max-width: 820px) {
    body { width: 100%; height: auto; }
    .post { width: 100%; height: auto; min-height: 1080px; }
    h1 { font-size: 48px; }
    .pricing { flex-direction: column; gap: 20px; }
    .price-card { min-width: auto; }
    .footer-cta { flex-direction: column; gap: 20px; }
  }
</style>
</head>
<body>
<div class="post">
  <div class="bg-pattern"></div>
  <div class="diagonal"></div>
  <div class="frame"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <!-- Header -->
    <div class="header">
      <div class="logo">SM</div>
      <div>
        <div class="brand-name">Seu Milton</div>
        <div class="brand-sub">Barbearia & Estilo</div>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="tag">🔥 Promoção imperdível</div>
      <h1>O visual que você merece,<br><span>preço que cabe no bolso</span></h1>
      <div class="line-deco"></div>

      <div class="pricing">
        <div class="price-card featured">
          <div class="label">Corte</div>
          <div class="service">Degradê + Tesoura</div>
          <div class="price"><small>R$</small>29<span>,99</span></div>
        </div>
        <div class="price-card">
          <div class="label">Barba</div>
          <div class="service">Aparação Completa</div>
          <div class="price"><small>R$</small>19<span>,99</span></div>
        </div>
        <div class="price-card">
          <div class="label">Combo</div>
          <div class="service">Corte + Barba</div>
          <div class="price"><small>R$</small>44<span>,99</span></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-cta">
      <div class="footer-note">
        Vagas limitadas • Agende seu horário • Resultado garantido
      </div>
      <a class="cta" href="https://wa.me/5587999999999">Agendar agora</a>
    </div>
  </div>
</div>
</body>
</html>
