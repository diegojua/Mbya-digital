<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{CLIENT_NAME}} - Feed Advocacia Premium</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap");

    :root {
      --bg: {{BG_PRIMARY}};
      --surface: {{BG_CARD}};
      --accent: {{ACCENT}};
      --text: {{TEXT_PRIMARY}};
      --muted: {{TEXT_MUTED}};
      --line: {{BORDER_COLOR}};
      --gold-line: rgba(212, 175, 55, 0.42);
      --font-headline: "{{FONT_HEADLINE}}", "Inter", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05070d;
      font-family: var(--font-body);
    }

    .ad {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 84% 18%, {{ACCENT_GLOW}}, transparent 24%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg) 56%, var(--surface) 56%, var(--surface) 100%);
      isolation: isolate;
    }

    .ad::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        repeating-linear-gradient(90deg, rgba(245, 247, 250, 0.035) 0 1px, transparent 1px 54px),
        repeating-linear-gradient(0deg, rgba(245, 247, 250, 0.018) 0 1px, transparent 1px 18px);
      pointer-events: none;
    }

    .ad::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 10;
      background:
        linear-gradient(90deg, rgba(11, 16, 32, 0.1), transparent 55%, rgba(11, 16, 32, 0.22)),
        radial-gradient(circle at 54% 74%, transparent 0 42%, rgba(0, 0, 0, 0.25) 82%);
      pointer-events: none;
    }

    .photo {
      position: absolute;
      right: 0;
      top: 0;
      width: 432px;
      height: 100%;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(11, 16, 32, 0.08), rgba(11, 16, 32, 0.78)),
        linear-gradient(90deg, rgba(11, 16, 32, 0.66), transparent 38%),
        url("{{IMAGE_URL}}");
      background-size: cover;
      background-position: center;
      filter: saturate(0.82) contrast(1.06);
    }

    .photo::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(18, 24, 38, 0.16);
    }

    .gold-rule {
      position: absolute;
      left: 72px;
      top: 204px;
      z-index: 12;
      width: 92px;
      height: 2px;
      background: var(--accent);
    }

    .brand {
      position: absolute;
      top: 58px;
      left: 72px;
      right: 72px;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(212, 175, 55, 0.62);
      color: var(--accent);
      font-family: var(--font-headline);
      font-size: 17px;
      font-weight: 900;
    }

    .brand-name {
      max-width: 420px;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-meta {
      max-width: 350px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      text-align: right;
    }

    .content {
      position: absolute;
      left: 72px;
      top: 252px;
      z-index: 12;
      width: 620px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2.4px;
      margin-bottom: 28px;
    }

    h1 {
      width: 620px;
      color: var(--text);
      font-family: var(--font-headline);
      font-size: 78px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .subtext {
      width: 560px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.42;
      font-weight: 500;
    }

    .subtext strong {
      color: var(--text);
      font-weight: 800;
    }

    .signal-card {
      position: absolute;
      left: 72px;
      bottom: 176px;
      z-index: 12;
      width: 535px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      background: rgba(18, 24, 38, 0.72);
      backdrop-filter: blur(14px);
    }

    .signal {
      min-height: 118px;
      padding: 22px;
      border-right: 1px solid var(--line);
    }

    .signal:last-child {
      border-right: 0;
    }

    .signal span {
      display: block;
      color: var(--accent);
      font-family: var(--font-headline);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .signal strong {
      display: block;
      margin-top: 18px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.12;
      font-weight: 900;
      text-transform: uppercase;
    }

    .cta-row {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 62px;
      z-index: 12;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .footer-copy {
      width: 410px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .cta {
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      color: #101624;
      background: var(--accent);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-decoration: none;
    }

    .micro {
      position: absolute;
      right: 72px;
      bottom: 176px;
      z-index: 12;
      width: 290px;
      padding-left: 22px;
      border-left: 1px solid var(--gold-line);
      color: rgba(245, 247, 250, 0.78);
      font-size: 17px;
      line-height: 1.42;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="ad" aria-label="Criativo premium para escritório de advocacia">
    <div class="photo"></div>
    <div class="brand">
      <div class="brand-left">
        <div class="mark">{{LOGO_ICON}}</div>
        <div class="brand-name">{{LOGO_TEXT}}</div>
      </div>
      <div class="brand-meta">{{LOGO_SUB}}</div>
    </div>

    <div class="gold-rule"></div>

    <section class="content">
      <div class="eyebrow">{{BADGE_TEXT}}</div>
      <h1>{{HEADLINE_LINE1}} {{HEADLINE_LINE2}}</h1>
      <p class="subtext">{{BODY_TEXT}}</p>
    </section>

    <section class="signal-card" aria-label="Diferenciais">
      {{SIGNAL_HTML}}
    </section>

    <p class="micro">Segurança para agir antes que uma decisão jurídica importante vire risco.</p>

    <footer class="cta-row">
      <p class="footer-copy">{{FOOTER_CTA_TEXT}}</p>
      <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
    </footer>
  </main>
</body>
</html>
