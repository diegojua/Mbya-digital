<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{CLIENT_NAME}} — Story Profissional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
        }
        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: #0b1020;
            font-family: Inter, sans-serif;
        }
        .story {
            position: relative;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            color: #ffffff;
            background: var(--bg);
        }
        .photo {
            position: absolute;
            inset: 0;
            background-image: url('{{IMAGE_URL}}');
            background-size: cover;
            background-position: center;
            transform: scale(1.02);
        }
        .shade {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(8,12,24,0.78) 0%, rgba(8,12,24,0.18) 34%, rgba(8,12,24,0.96) 100%),
                linear-gradient(90deg, rgba(8,12,24,0.88), rgba(8,12,24,0.24));
        }
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 88px 76px 82px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 44px;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            min-height: 70px;
        }
        .brand-left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }
        .brand-mark {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            color: var(--accent);
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.16);
            font-size: 31px;
        }
        .brand strong {
            display: block;
            max-width: 535px;
            color: #ffffff;
            font-size: 30px;
            line-height: 1.08;
            overflow-wrap: anywhere;
        }
        .brand span {
            display: block;
            margin-top: 8px;
            color: rgba(255,255,255,0.62);
            font-size: 16px;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
        }
        .badge {
            max-width: 305px;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--accent) 44%, transparent);
            background: color-mix(in srgb, var(--accent) 17%, rgba(255,255,255,0.06));
            color: var(--accent);
            font-size: 16px;
            font-weight: 950;
            line-height: 1;
            text-transform: uppercase;
            text-align: center;
        }
        .hero {
            align-self: end;
            padding-bottom: 14px;
        }
        h1 {
            max-width: 890px;
            font-family: var(--font-headline);
            font-size: 104px;
            line-height: 0.94;
            font-weight: 900;
            letter-spacing: 0;
        }
        h1 span {
            display: block;
            color: var(--accent);
        }
        .body-copy {
            max-width: 855px;
            margin-top: 34px;
            color: rgba(255,255,255,0.75);
            font-size: 34px;
            line-height: 1.22;
            font-weight: 650;
        }
        .bottom {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 28px;
            align-items: end;
            min-height: 270px;
            padding: 34px;
            border-radius: 28px;
            background: rgba(9,13,25,0.78);
            border: 1px solid rgba(255,255,255,0.16);
            backdrop-filter: blur(18px);
        }
        .check-list {
            display: grid;
            gap: 17px;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255,255,255,0.92);
            font-size: 25px;
            line-height: 1.15;
            font-weight: 850;
        }
        .check-icon {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 17%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 290px;
            min-height: 84px;
            padding: 0 30px;
            border-radius: 18px;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            text-align: center;
            font-size: 25px;
            line-height: 1.06;
            font-weight: 950;
            box-shadow: 0 22px 52px color-mix(in srgb, var(--accent) 35%, transparent);
        }
        .rail {
            position: absolute;
            left: 76px;
            top: 202px;
            width: 7px;
            height: 575px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 44%, transparent);
        }
    </style>
</head>
<body>
    <main class="story">
        <div class="photo" role="img" aria-label="{{IMAGE_ALT}}"></div>
        <div class="shade"></div>
        <div class="rail"></div>
        <section class="content">
            <header class="brand">
                <div class="brand-left">
                    <div class="brand-mark">{{LOGO_ICON}}</div>
                    <div>
                        <strong>{{LOGO_TEXT}}</strong>
                        <span>{{LOGO_SUB}}</span>
                    </div>
                </div>
                <div class="badge">{{BADGE_TEXT}}</div>
            </header>
            <div class="hero">
                <h1>{{HEADLINE_LINE1}} <span>{{HEADLINE_LINE2}}</span></h1>
                <p class="body-copy">{{BODY_TEXT}}</p>
            </div>
            <footer class="bottom">
                <div class="check-list">{{CHECKLIST_HTML}}</div>
                <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
            </footer>
        </section>
    </main>
</body>
</html>
