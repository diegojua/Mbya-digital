<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CLIENT_NAME}} - Carrossel Educação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --card: {{BG_CARD}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
            --blue: #2f80ed;
            --yellow: #ffd166;
        }
        body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
        }
        .canvas {
            position: relative;
            width: 1080px;
            height: 1080px;
            padding: 62px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 34px;
            background:
                radial-gradient(circle at 10% 10%, rgba(255,209,102,0.38) 0, transparent 260px),
                radial-gradient(circle at 88% 22%, rgba(47,128,237,0.16) 0, transparent 320px),
                linear-gradient(135deg, color-mix(in srgb, var(--bg) 82%, white), #ffffff 64%);
        }
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 26px;
            min-height: 70px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .mark {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 22%, transparent);
        }
        .brand strong {
            display: block;
            max-width: 480px;
            font-size: 26px;
            line-height: 1.05;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand span {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.2;
        }
        .badge {
            max-width: 330px;
            min-height: 42px;
            padding: 10px 16px;
            border-radius: 999px;
            color: var(--blue);
            background: rgba(47,128,237,0.09);
            border: 1px solid rgba(47,128,237,0.18);
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .main {
            display: grid;
            grid-template-columns: minmax(0, 0.92fr) minmax(380px, 1.08fr);
            gap: 38px;
            align-items: center;
            min-height: 0;
        }
        .copy {
            min-width: 0;
        }
        .headline {
            max-width: 500px;
            font-family: var(--font-headline);
            font-size: 62px;
            line-height: 0.98;
            font-weight: 800;
            letter-spacing: 0;
        }
        .headline em {
            display: block;
            color: var(--accent);
            font-style: normal;
        }
        .body {
            margin-top: 24px;
            max-width: 470px;
            color: var(--muted);
            font-size: 24px;
            line-height: 1.34;
        }
        .check-list {
            margin-top: 28px;
            display: grid;
            gap: 12px;
        }
        .check-item {
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            gap: 12px;
            min-height: 46px;
            color: var(--text);
            font-size: 19px;
            font-weight: 800;
            line-height: 1.15;
        }
        .check-icon {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(237,43,124,0.1);
            border: 1px solid rgba(237,43,124,0.22);
        }
        .check-icon svg { width: 19px; height: 19px; color: var(--accent); }
        .photo {
            position: relative;
            height: 650px;
            border-radius: 30px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid rgba(18,51,107,0.1);
            box-shadow: 0 28px 80px rgba(18,51,107,0.16);
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .photo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 58%, rgba(255,255,255,0.78));
            pointer-events: none;
        }
        .photo-caption {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            z-index: 1;
            padding: 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(18,51,107,0.1);
            backdrop-filter: blur(10px);
        }
        .photo-caption strong {
            display: block;
            font-size: 22px;
            line-height: 1.2;
        }
        .photo-caption span {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.28;
        }
        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            min-height: 76px;
        }
        .footer-note {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.3;
        }
        .cta {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 62px;
            padding: 0 28px;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-size: 21px;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 18px 38px color-mix(in srgb, var(--accent) 25%, transparent);
        }
    </style>
</head>
<body>
    <main class="canvas">
        <header class="top">
            <div class="brand">
                <div class="mark">{{LOGO_ICON}}</div>
                <div>
                    <strong>{{LOGO_TEXT}}</strong>
                    <span>{{LOGO_SUB}}</span>
                </div>
            </div>
            <div class="badge">{{BADGE_TEXT}}</div>
        </header>

        <section class="main">
            <div class="copy">
                <h1 class="headline">{{HEADLINE_LINE1}} <em>{{HEADLINE_LINE2}}</em></h1>
                <p class="body">{{BODY_TEXT}}</p>
                <div class="check-list">{{CHECKLIST_HTML}}</div>
            </div>
            <figure class="photo">
                <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
                <figcaption class="photo-caption">
                    <strong>{{FOOTER_CTA_TEXT}}</strong>
                    <span>{{LOCATION}}</span>
                </figcaption>
            </figure>
        </section>

        <footer class="bottom">
            <p class="footer-note">{{FOOTER_INFO}}</p>
            <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
        </footer>
    </main>
</body>
</html>
