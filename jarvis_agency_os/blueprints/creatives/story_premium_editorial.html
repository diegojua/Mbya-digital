<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CLIENT_NAME}} - Story Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --card: {{BG_CARD}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
        }
        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: var(--bg);
            font-family: Inter, sans-serif;
            color: var(--text);
        }
        .story {
            position: relative;
            width: 1080px;
            height: 1920px;
            padding: 96px 76px 84px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 54px;
            background:
                radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--accent) 22%, transparent) 0, transparent 330px),
                linear-gradient(180deg, color-mix(in srgb, var(--card) 62%, var(--bg)) 0%, var(--bg) 100%);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            min-height: 78px;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }
        .logo-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
            background: color-mix(in srgb, var(--card) 70%, transparent);
            font-size: 30px;
            line-height: 1;
        }
        .logo-text {
            min-width: 0;
        }
        .logo-text strong {
            display: block;
            font-size: 32px;
            line-height: 1.05;
            letter-spacing: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .logo-text span {
            display: block;
            margin-top: 6px;
            font-size: 18px;
            line-height: 1.25;
            color: var(--muted);
        }
        .badge {
            flex: 0 0 auto;
            padding: 14px 20px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
            background: color-mix(in srgb, var(--card) 78%, transparent);
        }
        .hero {
            display: grid;
            grid-template-rows: auto 720px auto;
            gap: 38px;
            min-height: 0;
        }
        .headline {
            font-family: var(--font-headline);
            font-size: 88px;
            font-weight: 800;
            line-height: 0.98;
            letter-spacing: 0;
            max-width: 900px;
        }
        .headline em {
            display: block;
            font-style: normal;
            color: var(--accent);
        }
        .photo-wrap {
            position: relative;
            height: 720px;
            border-radius: 34px;
            overflow: hidden;
            border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
            background: var(--card);
            box-shadow: 0 34px 90px rgba(0, 0, 0, 0.26);
        }
        .photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .photo-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 48%, rgba(0,0,0,0.34) 100%);
            pointer-events: none;
        }
        .body-copy {
            max-width: 850px;
            font-size: 35px;
            line-height: 1.24;
            color: var(--muted);
        }
        .bottom {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 34px;
            padding: 34px;
            min-height: 250px;
            border-radius: 32px;
            border: 1px solid color-mix(in srgb, var(--border) 74%, transparent);
            background: color-mix(in srgb, var(--card) 86%, transparent);
        }
        .check-list {
            display: grid;
            gap: 18px;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 42px;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.18;
            color: var(--text);
        }
        .check-icon {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
        }
        .cta {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 310px;
            min-height: 82px;
            padding: 0 34px;
            border-radius: 24px;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
            line-height: 1.05;
            text-align: center;
            box-shadow: 0 18px 40px color-mix(in srgb, var(--accent) 28%, transparent);
        }
    </style>
</head>
<body>
    <main class="story">
        <header class="brand">
            <div class="brand-mark">
                <div class="logo-icon">{{LOGO_ICON}}</div>
                <div class="logo-text">
                    <strong>{{LOGO_TEXT}}</strong>
                    <span>{{LOGO_SUB}}</span>
                </div>
            </div>
            <div class="badge">{{BADGE_TEXT}}</div>
        </header>

        <section class="hero">
            <h1 class="headline">{{HEADLINE_LINE1}} <em>{{HEADLINE_LINE2}}</em></h1>
            <figure class="photo-wrap">
                <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
            </figure>
            <p class="body-copy">{{BODY_TEXT}}</p>
        </section>

        <footer class="bottom">
            <div class="check-list">{{CHECKLIST_HTML}}</div>
            <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
        </footer>
    </main>
</body>
</html>
