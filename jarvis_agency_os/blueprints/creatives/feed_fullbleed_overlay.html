<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{CLIENT_NAME}} — {{BADGE_TEXT}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300&family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap');

        :root {
            --bg-primary: {{BG_PRIMARY}};
            --text-primary: {{TEXT_PRIMARY}};
            --text-muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --accent-glow: {{ACCENT_GLOW}};
            --border-color: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ============================================================
           BLUEPRINT B — FULLBLEED + GLASSMORPHISM OVERLAY
           Baseado em: dentista_criativo2.html
           Layout: Imagem Full-bleed + Card glassmorphism centralizado
           ============================================================ */
        .feed-container {
            width: 1080px;
            height: 1080px;
            background-image: url('{{IMAGE_URL}}');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px;
        }

        .feed-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }

        .frosted-card {
            width: 100%;
            max-width: 820px;
            background: rgba(253, 251, 247, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 45px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.25);
            padding: 70px 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .logo-icon {
            color: var(--accent);
            font-size: 2.2rem;
            line-height: 1;
            margin-bottom: 8px;
        }

        .logo-sub {
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: var(--font-headline);
            font-size: 3.2rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 25px;
        }

        h1 span {
            font-weight: 300;
            font-style: italic;
            color: var(--accent);
            display: block;
            margin-top: 5px;
        }

        .body-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 500;
            max-width: 600px;
            margin-bottom: 35px;
        }

        .checklist {
            display: flex;
            gap: 25px;
            margin-bottom: 45px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.04);
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .check-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 80%, black) 100%);
            color: #ffffff;
            padding: 16px 45px;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 10px 25px var(--accent-glow);
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="feed-container">
        <div class="frosted-card">
            <div class="logo-icon">{{LOGO_ICON}}</div>
            <div class="logo-sub">{{LOGO_SUB}}</div>

            <h1>
                {{HEADLINE_LINE1}}
                <span>{{HEADLINE_LINE2}}</span>
            </h1>

            <p class="body-text">{{BODY_TEXT}}</p>

            <div class="checklist">
                {{CHECKLIST_HTML}}
            </div>

            <a href="{{WHATSAPP_URL}}" class="cta-btn">{{CTA_TEXT}} ➔</a>
        </div>
    </div>
</body>
</html>
