<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{CLIENT_NAME}} — {{BADGE_TEXT}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --surface: {{BG_CARD}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
        }
        body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            background: #0b1020;
            font-family: Inter, sans-serif;
        }
        .post {
            position: relative;
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            color: #ffffff;
            background: var(--bg);
        }
        .photo {
            position: absolute;
            inset: 0;
            background-image: url('{{IMAGE_URL}}');
            background-size: cover;
            background-position: center;
            transform: scale(1.02);
        }
        .shade {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(8,12,24,0.96) 0%, rgba(8,12,24,0.72) 46%, rgba(8,12,24,0.08) 100%),
                linear-gradient(0deg, rgba(8,12,24,0.92) 0%, rgba(8,12,24,0.08) 42%, rgba(8,12,24,0.18) 100%);
        }
        .accent-bar {
            position: absolute;
            left: 72px;
            top: 72px;
            bottom: 72px;
            width: 7px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 38px color-mix(in srgb, var(--accent) 46%, transparent);
        }
        .content {
            position: relative;
            z-index: 2;
            width: 650px;
            height: 100%;
            padding: 76px 72px 70px 105px;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }
        .brand-mark {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--accent);
            font-size: 30px;
            line-height: 1;
        }
        .brand strong {
            display: block;
            max-width: 430px;
            color: #ffffff;
            font-size: 24px;
            line-height: 1.08;
            overflow-wrap: anywhere;
        }
        .brand span {
            display: block;
            margin-top: 7px;
            color: rgba(255,255,255,0.58);
            font-size: 14px;
            line-height: 1.2;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .main {
            align-self: center;
            padding-top: 34px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            max-width: 520px;
            padding: 0 16px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--accent) 16%, rgba(255,255,255,0.06));
            border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
            color: var(--accent);
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
        }
        h1 {
            margin-top: 28px;
            font-family: var(--font-headline);
            font-size: 72px;
            line-height: 0.93;
            letter-spacing: 0;
            font-weight: 900;
            max-width: 570px;
        }
        h1 span {
            display: block;
            color: var(--accent);
        }
        .body-copy {
            max-width: 510px;
            margin-top: 28px;
            color: rgba(255,255,255,0.74);
            font-size: 25px;
            line-height: 1.24;
            font-weight: 650;
        }
        .proof {
            display: grid;
            gap: 12px;
            margin-top: 32px;
            max-width: 515px;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 38px;
            color: rgba(255,255,255,0.9);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.16;
        }
        .check-icon {
            width: 28px;
            height: 28px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: color-mix(in srgb, var(--accent) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 48%, transparent);
        }
        .footer {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 26px;
            padding-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.13);
        }
        .footer-text {
            max-width: 300px;
            color: rgba(255,255,255,0.62);
            font-size: 17px;
            line-height: 1.28;
            font-weight: 700;
        }
        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 230px;
            min-height: 66px;
            padding: 0 24px;
            border-radius: 12px;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            text-align: center;
            font-size: 20px;
            font-weight: 950;
            line-height: 1.05;
            box-shadow: 0 18px 42px color-mix(in srgb, var(--accent) 34%, transparent);
        }
        .corner {
            position: absolute;
            right: 54px;
            bottom: 54px;
            z-index: 2;
            width: 165px;
            height: 165px;
            border-right: 2px solid rgba(255,255,255,0.55);
            border-bottom: 2px solid rgba(255,255,255,0.55);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <main class="post">
        <div class="photo" role="img" aria-label="{{IMAGE_ALT}}"></div>
        <div class="shade"></div>
        <div class="accent-bar"></div>
        <div class="corner"></div>
        <section class="content">
            <header class="brand">
                <div class="brand-mark">{{LOGO_ICON}}</div>
                <div>
                    <strong>{{LOGO_TEXT}}</strong>
                    <span>{{LOGO_SUB}}</span>
                </div>
            </header>
            <div class="main">
                <div class="badge">{{BADGE_TEXT}}</div>
                <h1>{{HEADLINE_LINE1}} <span>{{HEADLINE_LINE2}}</span></h1>
                <p class="body-copy">{{BODY_TEXT}}</p>
                <div class="proof">{{CHECKLIST_HTML}}</div>
            </div>
            <footer class="footer">
                <p class="footer-text">{{FOOTER_CTA_TEXT}}</p>
                <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
            </footer>
        </section>
    </main>
</body>
</html>
