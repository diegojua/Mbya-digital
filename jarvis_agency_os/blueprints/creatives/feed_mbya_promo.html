<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbya Marketing - Instagram Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .post {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: #050505;
        }

        /* BACKGROUND */
        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(245, 180, 60, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(217, 119, 6, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(252, 211, 77, 0.04) 0%, transparent 70%),
                linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow-top {
            position: absolute;
            top: -120px;
            right: -80px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(245, 180, 60, 0.18), transparent 70%);
            filter: blur(60px);
        }

        .glow-bottom {
            position: absolute;
            bottom: -100px;
            left: -60px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.12), transparent 70%);
            filter: blur(50px);
        }

        .glow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(252, 211, 77, 0.06), transparent 60%);
            filter: blur(40px);
        }

        /* PARTICLES */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(245, 180, 60, 0.3);
        }

        .particle-1 { width: 4px; height: 4px; top: 15%; left: 25%; opacity: 0.6; }
        .particle-2 { width: 3px; height: 3px; top: 30%; right: 20%; opacity: 0.4; }
        .particle-3 { width: 5px; height: 5px; bottom: 25%; left: 30%; opacity: 0.5; }
        .particle-4 { width: 3px; height: 3px; top: 60%; right: 35%; opacity: 0.3; }
        .particle-5 { width: 4px; height: 4px; top: 45%; left: 15%; opacity: 0.4; }
        .particle-6 { width: 2px; height: 2px; bottom: 35%; right: 15%; opacity: 0.5; }
        .particle-7 { width: 3px; height: 3px; top: 75%; left: 45%; opacity: 0.3; }
        .particle-8 { width: 4px; height: 4px; top: 20%; left: 65%; opacity: 0.4; }

        /* BRAND */
        .brand {
            position: absolute;
            top: 48px;
            left: 48px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fcd34d, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 22px;
            box-shadow: 0 8px 32px rgba(245, 180, 60, 0.3);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.35em;
            color: #f5b43c;
            text-transform: uppercase;
        }

        /* BADGE */
        .badge {
            position: absolute;
            top: 48px;
            right: 48px;
            padding: 12px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(245, 180, 60, 0.15), rgba(217, 119, 6, 0.1));
            border: 1px solid rgba(245, 180, 60, 0.3);
            color: #fcd34d;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.05em;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(245, 180, 60, 0.15);
        }

        /* DEVICES */
        .devices {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            z-index: 5;
        }

        .notebook {
            position: relative;
            width: 520px;
            height: 340px;
        }

        .notebook-screen {
            width: 100%;
            height: 300px;
            border-radius: 12px 12px 0 0;
            border: 2px solid #27272a;
            background: linear-gradient(180deg, #111111, #0a0a0a);
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .notebook-browser-bar {
            height: 32px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            border-bottom: 1px solid #27272a;
        }

        .notebook-browser-bar span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .notebook-browser-bar span:nth-child(1) { background: #ef4444; }
        .notebook-browser-bar span:nth-child(2) { background: #eab308; }
        .notebook-browser-bar span:nth-child(3) { background: #22c55e; }

        .notebook-url {
            margin-left: 12px;
            padding: 4px 12px;
            background: #111;
            border-radius: 4px;
            font-size: 10px;
            color: #71717a;
            flex: 1;
        }

        .notebook-content {
            padding: 20px;
            height: calc(100% - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notebook-hero {
            height: 80px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(245, 180, 60, 0.15), rgba(217, 119, 6, 0.08));
            border: 1px solid rgba(245, 180, 60, 0.2);
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .notebook-hero-text {
            width: 60%;
        }

        .notebook-hero-line {
            height: 8px;
            border-radius: 4px;
            background: rgba(252, 211, 77, 0.6);
            margin-bottom: 8px;
        }

        .notebook-hero-line:nth-child(1) { width: 80%; }
        .notebook-hero-line:nth-child(2) { width: 50%; background: rgba(245, 180, 60, 0.3); }

        .notebook-hero-btn {
            margin-left: auto;
            padding: 8px 16px;
            border-radius: 6px;
            background: linear-gradient(135deg, #fcd34d, #d97706);
            width: 80px;
            height: 24px;
        }

        .notebook-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .notebook-card {
            height: 50px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notebook-card-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(245, 180, 60, 0.4);
        }

        .notebook-bar {
            height: 6px;
            border-radius: 3px;
            background: #27272a;
            margin-top: auto;
        }

        .notebook-bar-fill {
            height: 100%;
            width: 70%;
            border-radius: 3px;
            background: linear-gradient(90deg, #fcd34d, #d97706);
        }

        .notebook-base {
            width: 110%;
            margin-left: -5%;
            height: 16px;
            background: linear-gradient(180deg, #27272a, #1a1a1a);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .notebook-base-notch {
            width: 80px;
            height: 4px;
            background: #3f3f46;
            border-radius: 2px;
            margin: 0 auto;
            margin-top: 4px;
        }

        /* PHONE */
        .phone {
            position: absolute;
            bottom: -40px;
            right: -60px;
            width: 140px;
            height: 280px;
            border-radius: 24px;
            border: 3px solid #27272a;
            background: linear-gradient(180deg, #111111, #0a0a0a);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .phone-notch {
            width: 60px;
            height: 16px;
            background: #000;
            border-radius: 0 0 12px 12px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .phone-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .phone-hero {
            height: 40px;
            border-radius: 6px;
            background: linear-gradient(135deg, rgba(245, 180, 60, 0.15), rgba(217, 119, 6, 0.08));
            border: 1px solid rgba(245, 180, 60, 0.2);
        }

        .phone-line {
            height: 4px;
            border-radius: 2px;
            background: #27272a;
        }

        .phone-line:nth-child(1) { width: 80%; }
        .phone-line:nth-child(2) { width: 60%; }
        .phone-line:nth-child(3) { width: 90%; }

        .phone-btn {
            margin-top: 8px;
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(135deg, #fcd34d, #d97706);
        }

        .phone-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .phone-card {
            height: 30px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #27272a;
        }

        /* FLOATING UI ELEMENTS */
        .float-card {
            position: absolute;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(245, 180, 60, 0.2);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .float-card-1 {
            top: 160px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .float-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(245, 180, 60, 0.2), rgba(217, 119, 6, 0.1));
            display: grid;
            place-items: center;
        }

        .float-icon svg {
            width: 16px;
            height: 16px;
            color: #fcd34d;
        }

        .float-text {
            font-size: 12px;
            font-weight: 700;
            color: #d4d4d4;
        }

        .float-sub {
            font-size: 10px;
            color: #71717a;
        }

        .float-card-2 {
            bottom: 180px;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .float-metric {
            font-size: 18px;
            font-weight: 900;
            color: #fcd34d;
        }

        .float-metric-label {
            font-size: 10px;
            color: #71717a;
        }

        /* TEXT CONTENT */
        .content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 48px;
            z-index: 10;
            background: linear-gradient(180deg, transparent, rgba(5, 5, 5, 0.95) 30%);
        }

        .headline {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .headline .gradient {
            background: linear-gradient(135deg, #fef3c7, #f5b43c, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subheadline {
            font-size: 20px;
            font-weight: 700;
            color: #d4d4d4;
            margin-bottom: 8px;
        }

        .sub-price {
            color: #fcd34d;
            font-weight: 900;
        }

        .secondary-text {
            font-size: 14px;
            color: #71717a;
            margin-bottom: 24px;
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fcd34d, #d97706);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 12px 40px rgba(245, 180, 60, 0.25);
        }

        .cta-btn svg {
            width: 20px;
            height: 20px;
        }

        .cta-secondary {
            font-size: 14px;
            color: #71717a;
            font-weight: 600;
        }

        /* DECORATIVE LINES */
        .line-accent {
            position: absolute;
            z-index: 5;
        }

        .line-1 {
            top: 120px;
            left: 0;
            width: 1px;
            height: 200px;
            background: linear-gradient(180deg, transparent, rgba(245, 180, 60, 0.2), transparent);
        }

        .line-2 {
            bottom: 300px;
            right: 0;
            width: 1px;
            height: 150px;
            background: linear-gradient(180deg, transparent, rgba(245, 180, 60, 0.15), transparent);
        }

        .line-3 {
            top: 50%;
            right: 120px;
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 180, 60, 0.2), transparent);
        }
    </style>
</head>
<body>
    <div class="post">
        <!-- BACKGROUNDS -->
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="glow-top"></div>
        <div class="glow-bottom"></div>
        <div class="glow-center"></div>

        <!-- PARTICLES -->
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
        <div class="particle particle-7"></div>
        <div class="particle particle-8"></div>

        <!-- DECORATIVE LINES -->
        <div class="line-accent line-1"></div>
        <div class="line-accent line-2"></div>
        <div class="line-accent line-3"></div>

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-mark">M</div>
            <div>
                <div class="brand-name">Mbya</div>
                <div class="brand-sub">MARKETING</div>
            </div>
        </div>

        <!-- BADGE -->
        <div class="badge">60% OFF</div>

        <!-- DEVICES -->
        <div class="devices">
            <div class="notebook">
                <div class="notebook-screen">
                    <div class="notebook-browser-bar">
                        <span></span><span></span><span></span>
                        <div class="notebook-url">mbyamarketing.com.br</div>
                    </div>
                    <div class="notebook-content">
                        <div class="notebook-hero">
                            <div class="notebook-hero-text">
                                <div class="notebook-hero-line"></div>
                                <div class="notebook-hero-line"></div>
                            </div>
                            <div class="notebook-hero-btn"></div>
                        </div>
                        <div class="notebook-cards">
                            <div class="notebook-card"><div class="notebook-card-dot"></div></div>
                            <div class="notebook-card"><div class="notebook-card-dot"></div></div>
                            <div class="notebook-card"><div class="notebook-card-dot"></div></div>
                        </div>
                        <div class="notebook-bar"><div class="notebook-bar-fill"></div></div>
                    </div>
                </div>
                <div class="notebook-base">
                    <div class="notebook-base-notch"></div>
                </div>
            </div>

            <div class="phone">
                <div class="phone-notch"></div>
                <div class="phone-content">
                    <div class="phone-hero"></div>
                    <div class="phone-line"></div>
                    <div class="phone-line"></div>
                    <div class="phone-line"></div>
                    <div class="phone-btn"></div>
                    <div class="phone-cards">
                        <div class="phone-card"></div>
                        <div class="phone-card"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FLOATING CARDS -->
        <div class="float-card float-card-1">
            <div class="float-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></svg>
            </div>
            <div>
                <div class="float-text">Alta Conversão</div>
                <div class="float-sub">SEO + Performance</div>
            </div>
        </div>

        <div class="float-card float-card-2">
            <div>
                <div class="float-metric">3x</div>
                <div class="float-metric-label">mais leads</div>
            </div>
        </div>

        <!-- TEXT CONTENT -->
        <div class="content">
            <h1 class="headline">
                Seu negócio precisa de um <span class="gradient">site profissional.</span>
            </h1>
            <p class="subheadline">
                Landing Page + Domínio incluso por apenas <span class="sub-price">R$ 600</span>
            </p>
            <p class="secondary-text">
                Especialista em criação de sites em Petrolina e Juazeiro
            </p>
            <div class="cta-row">
                <div class="cta-btn">
                    Chame no WhatsApp
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg>
                </div>
                <span class="cta-secondary">Vagas limitadas</span>
            </div>
        </div>
    </div>
</body>
</html>
