<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{CLIENT_NAME}} - Feed Educação Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: {{BG_PRIMARY}};
      --surface: {{BG_CARD}};
      --text: {{TEXT_PRIMARY}};
      --muted: {{TEXT_MUTED}};
      --accent: {{ACCENT}};
      --border: {{BORDER_COLOR}};
      --font-headline: "{{FONT_HEADLINE}}", Inter, sans-serif;
    }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: Inter, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .ad {
      position: relative;
      width: 1080px;
      height: 1080px;
      padding: 66px;
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      gap: 42px;
      background:
        radial-gradient(circle at 14% 16%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 270px),
        linear-gradient(135deg, color-mix(in srgb, var(--surface) 78%, var(--bg)) 0%, var(--bg) 100%);
    }
    .copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 0 0;
      z-index: 2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 54px;
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
      font-size: 26px;
      font-weight: 900;
    }
    .brand strong {
      display: block;
      max-width: 390px;
      font-size: 22px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .main-copy {
      padding: 52px 0 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    h1 {
      margin-top: 26px;
      max-width: 500px;
      font-family: var(--font-headline);
      font-size: 62px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
    }
    h1 span {
      display: block;
      color: var(--accent);
    }
    .body {
      margin-top: 24px;
      max-width: 460px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.42;
      font-weight: 500;
    }
    .checklist {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      max-width: 460px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 38px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .check-icon {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    }
    .cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      max-width: 500px;
      min-height: 86px;
      padding-top: 22px;
      border-top: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
    }
    .cta-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }
    .cta {
      flex: 0 0 auto;
      min-height: 54px;
      padding: 0 22px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }
    .visual {
      position: relative;
      min-width: 0;
      display: flex;
      align-items: stretch;
      z-index: 1;
    }
    .photo {
      position: relative;
      width: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      box-shadow: 0 28px 76px rgba(35, 43, 72, 0.18);
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 62%, rgba(0,0,0,0.26));
      pointer-events: none;
    }
    .floating {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 28px;
      padding: 20px 22px;
      border-radius: 22px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
      backdrop-filter: blur(10px);
    }
    .floating strong {
      display: block;
      font-size: 20px;
      line-height: 1.16;
    }
    .floating p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="ad">
    <section class="copy">
      <header class="brand">
        <div class="mark">{{LOGO_ICON}}</div>
        <div>
          <strong>{{LOGO_TEXT}}</strong>
          <span>{{LOGO_SUB}}</span>
        </div>
      </header>

      <div class="main-copy">
        <div class="badge">{{BADGE_TEXT}}</div>
        <h1>{{HEADLINE_LINE1}} <span>{{HEADLINE_LINE2}}</span></h1>
        <p class="body">{{BODY_TEXT}}</p>
      </div>

      <div class="checklist">{{CHECKLIST_HTML}}</div>

      <footer class="cta-row">
        <p class="cta-note">{{FOOTER_CTA_TEXT}}</p>
        <a class="cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
      </footer>
    </section>

    <section class="visual">
      <figure class="photo">
        <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
        <figcaption class="floating">
          <strong>Cada criança aprende em um ritmo.</strong>
          <p>O acompanhamento certo transforma dificuldade em evolução visível.</p>
        </figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
