<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{CLIENT_NAME}} — {{BADGE_TEXT}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300&family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-primary: {{BG_PRIMARY}};
            --text-primary: {{TEXT_PRIMARY}};
            --text-muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --accent-glow: {{ACCENT_GLOW}};
            --border-color: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #05070e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .feed-container {
            width: 1080px; height: 1080px;
            background: linear-gradient(135deg, rgba(15,20,36,0.96) 30%, rgba(15,20,36,0.75) 100%), url('{{IMAGE_URL}}');
            background-size: cover; background-position: center;
            border: 1px solid var(--border-color); position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; padding: 90px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(120px); background: var(--accent-glow); top: 20%; left: 10%; width: 500px; height: 500px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 10; }
        .logo-criativo { font-family: var(--font-headline); font-size: 2.2rem; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
        .logo-criativo span { color: var(--accent); font-weight: 300; }
        .category-badge { font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 800; color: var(--accent); border: 1px solid var(--accent); background: var(--accent-glow); padding: 6px 14px; border-radius: 50px; text-transform: uppercase; letter-spacing: 1.5px; }
        .feed-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 30px; z-index: 10; max-width: 850px; }
        .feed-body h1 { font-family: var(--font-headline); font-size: 4.8rem; font-weight: 600; line-height: 1.1; color: #ffffff; letter-spacing: -2px; }
        .feed-body h1 span { font-weight: 300; font-style: italic; color: var(--accent); }
        .feed-details { display: flex; gap: 40px; margin-top: 10px; }
        .detail-item { display: flex; align-items: center; gap: 12px; }
        .detail-dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; }
        .detail-text { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .feed-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 35px; z-index: 10; }
        .footer-cta-text { font-family: 'Outfit', sans-serif; font-size: 1rem; color: var(--text-muted); font-weight: 500; }
        .footer-cta-text span { color: #ffffff; font-weight: 700; }
        .footer-btn { background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, black) 100%); color: var(--bg-primary); font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 800; padding: 14px 30px; border-radius: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 8px 20px var(--accent-glow); }
    </style>
</head>
<body>
    <div class="feed-container">
        <div class="glow"></div>
        <div class="header-section">
            <div class="logo-criativo"><span>{{LOGO_ICON}}</span> {{LOGO_TEXT}}</div>
            <div class="category-badge">{{BADGE_TEXT}}</div>
        </div>
        <div class="feed-body">
            <h1>{{HEADLINE_LINE1}}<span>{{HEADLINE_LINE2}}</span></h1>
            <div class="feed-details">{{DETAILS_HTML}}</div>
        </div>
        <div class="feed-footer">
            <p class="footer-cta-text">{{FOOTER_INFO}} <span>{{FOOTER_CTA_TEXT}}</span></p>
            <a href="{{WHATSAPP_URL}}" class="footer-btn">{{CTA_TEXT}}</a>
        </div>
    </div>
</body>
</html>
