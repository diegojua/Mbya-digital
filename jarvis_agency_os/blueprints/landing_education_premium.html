<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CLIENT_NAME}} - {{NICHE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --surface: {{BG_CARD}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
            --blue: #2f80ed;
            --yellow: #ffd166;
        }
        html { scroll-behavior: smooth; background: var(--bg); }
        body {
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
        }
        .page {
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 12%, rgba(255,209,102,0.34) 0, transparent 320px),
                radial-gradient(circle at 88% 18%, rgba(47,128,237,0.16) 0, transparent 360px),
                linear-gradient(180deg, color-mix(in srgb, var(--bg) 82%, white) 0%, #ffffff 58%, color-mix(in srgb, var(--bg) 72%, white) 100%);
        }
        .shell { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
        .nav {
            min-height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 22%, transparent);
            font-weight: 800;
        }
        .brand strong { display: block; font-size: 17px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
        .nav-cta,
        .hero-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 22px;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 18px 40px color-mix(in srgb, var(--accent) 24%, transparent);
        }
        .hero {
            min-height: 690px;
            display: grid;
            grid-template-columns: minmax(0, 0.98fr) minmax(380px, 1.02fr);
            gap: 64px;
            align-items: center;
            padding: 52px 0 78px;
        }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            color: var(--blue);
            background: rgba(47,128,237,0.1);
            border: 1px solid rgba(47,128,237,0.18);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        h1 {
            margin-top: 24px;
            max-width: 720px;
            font-family: var(--font-headline);
            font-size: clamp(44px, 5.6vw, 82px);
            line-height: 0.98;
            font-weight: 800;
            letter-spacing: 0;
        }
        h1 span { color: var(--accent); }
        .hero-copy {
            max-width: 600px;
            margin-top: 26px;
            color: var(--muted);
            font-size: 20px;
            line-height: 1.58;
        }
        .hero-actions { margin-top: 34px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        .trust-note { max-width: 310px; color: var(--muted); font-size: 14px; line-height: 1.45; }
        .visual-panel {
            position: relative;
            min-height: 548px;
            border-radius: 30px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid rgba(18,51,107,0.1);
            box-shadow: 0 30px 90px rgba(18,51,107,0.16);
        }
        .visual-panel img { width: 100%; height: 548px; object-fit: cover; object-position: center; display: block; }
        .visual-card {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            padding: 22px;
            border-radius: 22px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(18,51,107,0.1);
            backdrop-filter: blur(10px);
        }
        .visual-card strong { display: block; font-size: 20px; line-height: 1.25; color: var(--text); }
        .visual-card p { margin-top: 8px; color: var(--muted); line-height: 1.45; }
        .section { padding: 80px 0; border-top: 1px solid rgba(18,51,107,0.08); }
        .section-head { max-width: 780px; margin-bottom: 34px; }
        .section h2 { font-family: var(--font-headline); font-size: clamp(34px, 4vw, 58px); line-height: 1.04; font-weight: 800; }
        .section-head p { margin-top: 14px; color: var(--muted); font-size: 18px; line-height: 1.55; }
        .benefits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
        .benefit {
            min-height: 194px;
            padding: 26px;
            border-radius: 24px;
            background: #ffffff;
            border: 1px solid rgba(18,51,107,0.09);
            box-shadow: 0 18px 46px rgba(18,51,107,0.08);
        }
        .benefit svg { width: 32px; height: 32px; color: var(--accent); margin-bottom: 20px; }
        .benefit strong { display: block; font-size: 20px; line-height: 1.22; }
        .benefit p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.55; }
        .final { padding: 72px 0 92px; }
        .final-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 28px;
            align-items: center;
            padding: 38px;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffffff, color-mix(in srgb, var(--bg) 66%, white));
            border: 1px solid rgba(18,51,107,0.1);
            box-shadow: 0 22px 60px rgba(18,51,107,0.1);
        }
        .final-box h2 { font-family: var(--font-headline); font-size: 40px; line-height: 1.05; }
        .final-box p { margin-top: 10px; color: var(--muted); line-height: 1.5; }
        @media (max-width: 820px) {
            .shell { width: min(100% - 32px, 640px); }
            .nav { min-height: 76px; }
            .nav-cta { display: none; }
            .hero { min-height: auto; grid-template-columns: 1fr; gap: 34px; padding: 40px 0 60px; }
            .visual-panel { min-height: 420px; }
            .visual-panel img { height: 420px; }
            .benefits { grid-template-columns: 1fr; }
            .final-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <nav class="shell nav">
            <div class="brand">
                <div class="brand-mark">{{LOGO_ICON}}</div>
                <div>
                    <strong>{{CLIENT_NAME}}</strong>
                    <span>{{NICHE}}</span>
                </div>
            </div>
            <a class="nav-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
        </nav>
        <section class="shell hero">
            <div>
                <div class="eyebrow">{{BADGE_TEXT}}</div>
                <h1>{{HEADLINE_LINE1}} <span>{{HEADLINE_LINE2}}</span></h1>
                <p class="hero-copy">{{BODY_TEXT}}</p>
                <div class="hero-actions">
                    <a class="hero-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
                    <p class="trust-note">{{FOOTER_CTA_TEXT}}</p>
                </div>
            </div>
            <figure class="visual-panel">
                <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
                <figcaption class="visual-card">
                    <strong>{{VISUAL_CARD_TITLE}}</strong>
                    <p>{{VISUAL_CARD_TEXT}}</p>
                </figcaption>
            </figure>
        </section>
        <section class="shell section">
            <div class="section-head">
                <h2>{{SECTION_TITLE}}</h2>
                <p>{{SECTION_TEXT}}</p>
            </div>
            <div class="benefits">{{BENEFITS_HTML}}</div>
        </section>
        <section class="shell final">
            <div class="final-box">
                <div>
                    <h2>{{FINAL_TITLE}}</h2>
                    <p>{{FINAL_TEXT}}</p>
                </div>
                <a class="hero-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
            </div>
        </section>
    </main>
</body>
</html>
