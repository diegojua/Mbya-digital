<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{CLIENT_NAME}} - {{NICHE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family={{FONT_HEADLINE}}:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: {{BG_PRIMARY}};
            --surface: {{BG_CARD}};
            --text: {{TEXT_PRIMARY}};
            --muted: {{TEXT_MUTED}};
            --accent: {{ACCENT}};
            --border: {{BORDER_COLOR}};
            --font-headline: '{{FONT_HEADLINE}}', Inter, sans-serif;
        }
        html { scroll-behavior: smooth; background: var(--bg); }
        body {
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
        }
        .page {
            overflow: hidden;
            background:
                radial-gradient(circle at 78% 8%, color-mix(in srgb, var(--accent) 18%, transparent) 0, transparent 360px),
                linear-gradient(180deg, color-mix(in srgb, var(--surface) 62%, var(--bg)) 0%, var(--bg) 680px);
        }
        .shell {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
        }
        .nav {
            min-height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
            background: color-mix(in srgb, var(--surface) 78%, transparent);
        }
        .brand strong {
            display: block;
            font-size: 17px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }
        .nav-cta,
        .hero-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 20px;
            border-radius: 14px;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            font-weight: 800;
            line-height: 1;
        }
        .hero {
            min-height: 720px;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
            gap: 70px;
            align-items: center;
            padding: 76px 0 82px;
        }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 13px;
            border-radius: 999px;
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        h1 {
            margin-top: 26px;
            max-width: 780px;
            font-family: var(--font-headline);
            font-size: clamp(48px, 6vw, 86px);
            line-height: 0.96;
            font-weight: 800;
            letter-spacing: 0;
        }
        h1 span { color: var(--accent); }
        .hero-copy {
            max-width: 620px;
            margin-top: 28px;
            color: var(--muted);
            font-size: 21px;
            line-height: 1.55;
        }
        .hero-actions {
            margin-top: 38px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .hero-cta { min-height: 58px; padding: 0 26px; }
        .trust-note {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
        }
        .visual-panel {
            position: relative;
            min-height: 520px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid color-mix(in srgb, var(--border) 76%, transparent);
            box-shadow: 0 34px 90px rgba(0,0,0,0.22);
        }
        .visual-panel img {
            width: 100%;
            height: 520px;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .visual-card {
            position: absolute;
            left: 28px;
            right: 28px;
            bottom: 28px;
            padding: 22px;
            border-radius: 20px;
            background: color-mix(in srgb, var(--surface) 86%, transparent);
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            backdrop-filter: blur(12px);
        }
        .visual-card strong {
            display: block;
            font-size: 19px;
            line-height: 1.25;
        }
        .visual-card p {
            margin-top: 8px;
            color: var(--muted);
            line-height: 1.45;
        }
        .section {
            padding: 82px 0;
            border-top: 1px solid color-mix(in srgb, var(--border) 64%, transparent);
        }
        .section-head {
            max-width: 760px;
            margin-bottom: 34px;
        }
        .section h2 {
            font-family: var(--font-headline);
            font-size: clamp(34px, 4vw, 56px);
            line-height: 1.04;
            font-weight: 800;
        }
        .section-head p {
            margin-top: 14px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.55;
        }
        .benefits {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }
        .benefit {
            min-height: 188px;
            padding: 26px;
            border-radius: 20px;
            background: color-mix(in srgb, var(--surface) 78%, transparent);
            border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
        }
        .benefit svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .benefit strong {
            display: block;
            font-size: 20px;
            line-height: 1.22;
        }
        .benefit p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }
        .final {
            padding: 76px 0 92px;
        }
        .final-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 28px;
            align-items: center;
            padding: 38px;
            border-radius: 26px;
            background: var(--surface);
            border: 1px solid color-mix(in srgb, var(--border) 76%, transparent);
        }
        .final-box h2 {
            font-family: var(--font-headline);
            font-size: 40px;
            line-height: 1.05;
        }
        .final-box p {
            margin-top: 10px;
            color: var(--muted);
            line-height: 1.5;
        }
        @media (max-width: 820px) {
            .shell { width: min(100% - 32px, 640px); }
            .nav { min-height: 76px; }
            .nav-cta { display: none; }
            .hero {
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 34px;
                padding: 46px 0 60px;
            }
            .visual-panel { min-height: 420px; }
            .visual-panel img { height: 420px; }
            .benefits { grid-template-columns: 1fr; }
            .final-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <nav class="shell nav">
            <div class="brand">
                <div class="brand-mark">{{LOGO_ICON}}</div>
                <div>
                    <strong>{{CLIENT_NAME}}</strong>
                    <span>{{NICHE}}</span>
                </div>
            </div>
            <a class="nav-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
        </nav>

        <section class="shell hero">
            <div>
                <div class="eyebrow">{{BADGE_TEXT}}</div>
                <h1>{{HEADLINE_LINE1}} <span>{{HEADLINE_LINE2}}</span></h1>
                <p class="hero-copy">{{BODY_TEXT}}</p>
                <div class="hero-actions">
                    <a class="hero-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
                    <p class="trust-note">{{FOOTER_CTA_TEXT}}</p>
                </div>
            </div>
            <figure class="visual-panel">
                <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
                <figcaption class="visual-card">
                    <strong>{{VISUAL_CARD_TITLE}}</strong>
                    <p>{{VISUAL_CARD_TEXT}}</p>
                </figcaption>
            </figure>
        </section>

        <section class="shell section">
            <div class="section-head">
                <h2>{{SECTION_TITLE}}</h2>
                <p>{{SECTION_TEXT}}</p>
            </div>
            <div class="benefits">
                {{BENEFITS_HTML}}
            </div>
        </section>

        <section class="shell final">
            <div class="final-box">
                <div>
                    <h2>{{FINAL_TITLE}}</h2>
                    <p>{{FINAL_TEXT}}</p>
                </div>
                <a class="hero-cta" href="{{WHATSAPP_URL}}">{{CTA_TEXT}}</a>
            </div>
        </section>
    </main>
</body>
</html>
